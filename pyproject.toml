[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mylm"
version = "0.2.0"
description = "A small GPT-style language model with its own BPE tokenizer, built and trained from scratch in PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mylm-prepare = "mylm.prepare:main"
mylm-train = "mylm.train:main"
mylm-generate = "mylm.generate:main"

[tool.setuptools.packages.find]
include = ["mylm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
